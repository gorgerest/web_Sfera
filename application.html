<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Оставить заявку | Сфера Охрана</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
    <link rel="stylesheet" href="style.css" />
    <style>
      .application-container {
        max-width: 600px;
        margin: 60px auto;
        padding: 40px;
        background: #ffffff;
        border-radius: 16px;
        box-shadow: 0 8px 24px rgba(0, 0, 0, 0.1);
      }

      .application-container h1 {
        font-size: 2rem;
        font-weight: 700;
        color: #1f2a36;
        margin-bottom: 30px;
        text-align: center;
      }

      .form-label {
        font-weight: 600;
        color: #1f2a36;
        margin-bottom: 8px;
      }

      .form-control {
        border: 1px solid #ddd;
        border-radius: 6px;
        padding: 10px 12px;
        font-size: 1rem;
      }

      .form-control:focus {
        border-color: #1f2a36;
        box-shadow: 0 0 0 0.2rem rgba(31, 42, 54, 0.25);
      }

      .btn-submit {
        background: linear-gradient(135deg, #1f2a36 0%, #27303b 100%);
        color: #ffffff;
        padding: 12px 32px;
        border: none;
        border-radius: 6px;
        font-weight: 600;
        font-size: 1rem;
        cursor: pointer;
        transition: all 0.3s ease;
        width: 100%;
      }

      .btn-submit:hover {
        background: linear-gradient(135deg, #27303b 0%, #1f2a36 100%);
        color: #ffffff;
        text-decoration: none;
        transform: scale(1.02);
      }

      .back-link {
        text-align: center;
        margin-top: 20px;
      }

      .back-link a {
        color: #1f2a36;
        text-decoration: none;
        font-weight: 600;
      }

      .back-link a:hover {
        text-decoration: underline;
      }
    </style>
  </head>
  <body style="background-color: #f4f6f8;">
    <div class="application-container">
      <h1>Оставить заявку</h1>
      
      <form action="https://formsubmit.co/vnukgeorgii@gmail.com" method="POST">
        <input type="hidden" name="_subject" value="Новая заявка с сайта Сфера Охрана">
        <input type="hidden" name="_captcha" value="false">
        <input type="hidden" name="_next" value="https://sferaguard.ru/success.html">
        <input type="text" name="_honey" style="display:none">

        <div class="mb-3">
          <label for="name" class="form-label">Имя *</label>
          <input type="text" class="form-control" id="name" name="name" placeholder="Ваше имя" required>
        </div>

        <div class="mb-3">
          <label for="email" class="form-label">Email *</label>
          <input type="email" class="form-control" id="email" name="email" placeholder="your@email.com" required>
        </div>

        <div class="mb-3">
          <label for="address" class="form-label">Адрес объекта *</label>
          <input type="text" class="form-control" id="address" name="address" placeholder="Адрес объекта" required>
        </div>

        <div class="mb-3">
          <label for="message" class="form-label">Сообщение</label>
          <textarea class="form-control" id="message" name="message" rows="4" placeholder="Опишите вашу заявку"></textarea>
        </div>

        <button type="submit" class="btn-submit">Отправить заявку</button>
      </form>

      <div class="back-link">
        <a href="index.html">← Вернуться на главную</a>
      </div>
    </div>
  </body>
</html>
